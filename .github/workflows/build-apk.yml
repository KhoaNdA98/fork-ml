name: Build APK

on:
  push:
    branches: [ moonlight-noir ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleNonRoot_gameDebug

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-noir-arm64
          path: app/build/outputs/apk/nonRoot_game/debug/*arm64-v8a*.apk
          retention-days: 7
